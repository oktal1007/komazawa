services:
  - type: web
    name: bastet-divination-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: CANVA_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
